[package]
name = "distroctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
distro-config = { path = "../config" }
distro-hardware = { path = "../hardware" }
distro-graphics = { path = "../graphics" }
distro-snapshots = { path = "../snapshots" }
distro-transactions = { path = "../transactions" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"

[features]
native-alpm = ["distro-transactions/native-alpm"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
