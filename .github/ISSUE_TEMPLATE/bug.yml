name: Bug report
description: A reproducible defect in the tools, image or installed system.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Revision and environment
      description: Commit or image hash, host/guest OS, firmware and hardware/VM details. Remove personal identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected behavior and what actually happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant logs or screenshots. Redact credentials and private signing material. Report vulnerabilities privately.
