name: Bootstrap checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install development toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.96.0 fmt --all --check
      - run: cargo +1.96.0 test --workspace --locked
      - run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Install image regression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso
      - run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n scripts/publish-repo.sh
          bash -n tests/boot/live-smoke.sh
          bash -n distro/archiso/profiledef.sh.in
          bash -n distro/packages/distroctl/PKGBUILD.in
          bash -n scripts/validate/arch-builder.sh
          bash -n distro/packages/calamares/PKGBUILD
          bash -n distro/installed/linux.preset.in
          bash -n distro/installed/mkinitcpio.conf
          bash -n tests/boot/installed-smoke.sh
      - name: Verify archived inputs
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/bootstrap.py verify-archive
