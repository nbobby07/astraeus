name: Checks
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Host checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install development toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.96.0 fmt --all --check
      - run: cargo +1.96.0 test --workspace --locked
      - run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Install image regression tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso qemu-utils
      - run: python -m unittest discover -s tests -v
      - name: Shell syntax
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/publish-repo.sh
          bash -n tests/boot/live-smoke.sh
          bash -n distro/archiso/profiledef.sh.in
          bash -n distro/packages/distroctl/PKGBUILD.in
          bash -n scripts/validate/arch-builder.sh
          bash -n distro/packages/calamares/PKGBUILD
          bash -n distro/installed/linux.preset.in
          bash -n distro/installed/mkinitcpio.conf
          bash -n tests/boot/installed-smoke.sh
          bash -n tests/fixtures/phase2/adapter.sh
          bash -n tests/fixtures/phase2/PKGBUILD
          bash -n .githooks/commit-msg
      - name: Verify archived inputs
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: python scripts/bootstrap.py verify-archive
  commit-subject:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Conventional Commit subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check-commit.py
