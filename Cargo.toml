[workspace]
members = ["crates/distroctl", "crates/config", "crates/hardware", "crates/snapshots", "crates/transactions"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
